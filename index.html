<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Show</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 16:9 stage centred on black, everything placed in stage percentages so the drawings line up at any size. Single committed dark frame. */
:root{
  --black:#000; --ink:#2b3a47; --box:#e4eff8; --box-edge:#9fd6f2; --leaf:#88a070;
  --meow:#7fbfe3; --mmm:#f2a7b0; --mdm:#e8a93c; --mm:#7fb36a;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--black);color:var(--ink);font-family:var(--font);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;max-width:100%;overflow:hidden;container-type:inline-size;background:#000;user-select:none;-webkit-user-select:none}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s}
.scene.on{opacity:1;visibility:visible;transition:opacity .6s}
.bg.swap{pointer-events:none}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.bg.swap{transition:opacity .5s}

.hot{position:absolute;cursor:pointer;border-radius:40%;
  background:radial-gradient(ellipse at center,rgba(255,255,240,.32),rgba(255,255,240,0) 70%);opacity:0;transition:opacity .25s}
.hot:hover,.hot:focus-visible{opacity:1;outline:none}
.hot[hidden]{display:none}

.arrow{position:absolute;top:50%;transform:translateY(-50%);width:4.2cqw;height:4.2cqw;border:0;padding:0;cursor:pointer;
  background:transparent;display:grid;place-items:center;animation:nudge 1.6s ease-in-out infinite}
.arrow svg{width:38%;height:38%}
.arrow.r{right:1.6cqw} .arrow.l{left:1.6cqw;animation-name:nudgeL}
.arrow:focus-visible{outline:.2cqw solid #fff;outline-offset:.3cqw}
@keyframes nudge{50%{transform:translate(.5cqw,-50%)}}
@keyframes nudgeL{50%{transform:translate(-.5cqw,-50%)}}

.cal{position:absolute;left:82.4%;top:13.6%;width:4.4%;height:6%;background:#dfdedc;box-shadow:0 0 .35cqw .3cqw #dfdedc;border-radius:.3cqw;pointer-events:none}
.calimg{position:absolute;max-width:none;height:auto;pointer-events:none}
.hint{position:absolute;left:50%;transform:translateX(-50%);font-weight:500;font-size:1.15cqw;letter-spacing:.02em;color:#fff;
  text-shadow:0 .08cqw .3cqw rgba(0,0,0,.35);white-space:nowrap;pointer-events:none;transition:opacity .4s}
.knock{position:absolute;font-weight:700;font-size:1.8cqw;color:#fff;text-shadow:0 .15cqw .5cqw rgba(0,0,0,.4);pointer-events:none;animation:pop .7s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(0) scale(.8)}20%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:translateY(-3cqw)}}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-.25cqw)}75%{transform:translateX(.25cqw)}}

/* window: full green */
.pan{position:absolute;left:0;top:0;width:100%;height:auto;max-width:none;transform:translateY(-61.3%);will-change:transform}
.streetTap{position:absolute;inset:0;cursor:pointer}
.streetTap.center{inset:25% 30%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,240,.28),rgba(255,255,240,0) 70%);opacity:0;transition:opacity .3s}
.streetTap.center:hover,.streetTap.center:focus-visible{opacity:1;outline:none}
#hall{background:#000;--mx:50%;--my:55%;--r:0px}
#hall.explore{cursor:none}
.lit{position:absolute;inset:0;background:rgba(255,246,232,.05);
  -webkit-mask-image:radial-gradient(circle var(--r) at var(--mx) var(--my),#000 0 30%,rgba(0,0,0,.5) 62%,transparent 100%);
          mask-image:radial-gradient(circle var(--r) at var(--mx) var(--my),#000 0 30%,rgba(0,0,0,.5) 62%,transparent 100%)}
.world{position:absolute;top:0;left:0;width:300%;height:100%;transform:translateX(-33.333%);transition:transform 1.8s cubic-bezier(.45,0,.25,1)}
.bars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sil{position:absolute;width:auto;max-width:none;pointer-events:none;user-select:none}
.peek{position:absolute;top:50%;width:0;height:0;border-top:.7cqw solid transparent;border-bottom:.7cqw solid transparent;opacity:0;transition:opacity 1s;pointer-events:none;transform:translateY(-50%)}
.peek.l{left:1.4cqw;border-right:1cqw solid rgba(255,255,255,.22)}
.peek.r{right:1.4cqw;border-left:1cqw solid rgba(255,255,255,.22)}
#hall.explore .peek.on{opacity:1}
.sub{position:absolute;left:0;right:0;bottom:16%;z-index:31;text-align:center;color:#fff;font-weight:500;font-size:1.7cqw;letter-spacing:.02em;
  opacity:0;transition:opacity .8s;pointer-events:none;text-shadow:0 .1cqw .6cqw rgba(0,0,0,.6)}
.sub.on{opacity:1}
.talk.bare .who{display:none}
.talk.bare .box{padding-left:6%;padding-right:6%}
.talk.nobox .box{display:none}
.square{position:absolute;top:0;left:50%;height:100%;width:auto;max-width:none;transform:translateX(-50%);transition:opacity .25s;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
#doorlight{background:#000}
#judge,#jcage{background:#030305}
.aud{position:absolute;left:0;right:0;top:3%;height:58%;--b:.85}
.pair{position:absolute;display:flex;gap:calc(var(--s)*.6);transform:translate(-50%,-50%);opacity:calc(var(--b) * var(--depth));transition:opacity 1s}
.eye{width:var(--s);height:calc(var(--s)*.6);border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 45%,#fff 0%,var(--c) 35%,color-mix(in srgb,var(--c) 55%,#000) 100%);
  box-shadow:0 0 calc(var(--s)*.5) calc(var(--s)*.12) color-mix(in srgb,var(--c) 70%,transparent),0 0 calc(var(--s)*1.6) calc(var(--s)*.3) color-mix(in srgb,var(--c) 30%,transparent);transition:transform .15s}
.eye::after{content:"";position:absolute;left:50%;top:6%;bottom:6%;width:var(--pupil,22%);transform:translateX(-50%);background:#050505;border-radius:50%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pair.blink .eye{transform:scaleY(.08)}
.aud.wide{--pupil:62%} .aud.slit{--pupil:7%}
.aud .eye{filter:url(#roughSm)}
.aud .eye{background:url(img/grain.png),radial-gradient(circle at 50% 45%,#fff 0%,var(--c) 35%,color-mix(in srgb,var(--c) 55%,#000) 100%);background-size:1.2cqw,auto;background-blend-mode:soft-light,normal}
.pool{position:absolute;left:-20%;right:-20%;bottom:-6%;height:46%;pointer-events:none;
  background:radial-gradient(ellipse 42% 62% at 50% 100%,#fff4d0 0%,#ffcf73 22%,#e09a3a99 46%,#5a3a1033 70%,transparent 82%)}
.tedge{position:absolute;left:0;right:0;bottom:32%;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,#ffcf7366 30%,#ffcf73aa 50%,#ffcf7366 70%,transparent)}
.jhud{position:absolute;top:1.6cqw;left:2cqw;display:flex;flex-direction:column;gap:.4cqw;font-size:.85cqw;letter-spacing:.16em;text-transform:uppercase;color:#6e6559;z-index:3}
.jhud b{color:#f3ecdf;font-weight:600;font-variant-numeric:tabular-nums;font-size:1.2cqw;letter-spacing:.04em}
.jdelta{display:inline-block;margin-left:.6cqw;font-size:1cqw;opacity:0;transition:opacity .3s}
.jdelta.show{opacity:1}
.jnarr{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:60%;text-align:center;z-index:3}
.jnarr::before{content:"";position:absolute;left:-8%;right:-8%;top:-55%;bottom:-55%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse closest-side,rgba(3,3,5,.92) 30%,rgba(3,3,5,.6) 60%,transparent 100%)}
.jline{margin:0;font-weight:400;font-style:italic;font-size:2.3cqw;line-height:1.35;color:#f3ecdf;text-wrap:balance;opacity:0;filter:blur(6px);transform:translateY(6px);
  transition:opacity 1.1s,filter 1.1s,transform 1.1s;text-shadow:0 .1cqw .6cqw #000}
.jline.in{opacity:1;filter:none;transform:none}
.jreact{font-size:.95cqw;letter-spacing:.14em;text-transform:uppercase;margin-top:1.1cqw;min-height:1.4em;color:#9a8f80}
.jreact.good{color:#b7f36a} .jreact.bad{color:#e8706c}
.jtimer{width:40%;height:2px;margin:1.4cqw auto 0;background:#ffffff14;overflow:hidden;border-radius:1px;visibility:hidden}
.jtimer.on{visibility:visible}
.jtimer i{display:block;height:100%;background:#ffcf73;transform-origin:left}
.jchoices{position:absolute;left:50%;bottom:2.2cqw;transform:translateX(-50%);width:44%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8cqw;z-index:3}
.jchoices.single{grid-template-columns:minmax(0,17cqw);justify-content:center}
.jbtn{font:inherit;font-weight:500;font-size:1cqw;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:#2a1b08;background:#ffe2a6e6;border:1px solid #fff0cc;border-radius:.3cqw;padding:1cqw .5cqw;transition:background .2s}
.jbtn:hover:not(:disabled){background:#fff0cc}
.jbtn:focus-visible{outline:2px solid #f3ecdf;outline-offset:3px}
.jbtn:disabled{opacity:.4;cursor:default}
.jslip{position:absolute;right:2cqw;top:5cqw;width:21cqw;background:transparent;isolation:isolate;color:#24201a;padding:1cqw 1.2cqw 1.2cqw;border-radius:2px;z-index:4;
  transform:translateX(130%) rotate(2deg);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.jslip.show{transform:translateX(0) rotate(-1.5deg)}
.jslip::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:2px;filter:url(#rough) drop-shadow(0 .8cqw 1.4cqw rgba(0,0,0,.7));
  background:url(img/grain.png),linear-gradient(170deg,#f6f0e3,#ece3d0);background-size:7cqw,auto;background-blend-mode:multiply,normal}
.jslip small{display:block;font-size:.8cqw;letter-spacing:.16em;text-transform:uppercase;color:#7a7062;margin-bottom:.5cqw}
.jslip p{margin:0;font-size:1.35cqw;line-height:1.35}
.jpts{margin-top:.6cqw;font-size:.95cqw;letter-spacing:.08em;color:#7a7062}
.jnote{margin-top:.6cqw;font-size:.85cqw;color:#7a7062;line-height:1.5}
#jcage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw}
#jcage.on{display:flex}
.cline{margin:0;font-style:italic;font-size:2cqw;color:#f3ecdf;opacity:0;transition:opacity 1.2s}
.cline.in{opacity:1}
.hot.gap{background:radial-gradient(ellipse at center,rgba(255,220,140,.35),rgba(255,220,140,0) 70%)}
#corridor{background:#050404}
.cwall{position:absolute;inset:0;background:linear-gradient(#0b0908,#141110 62%,#0a0807 62.4%,#060505)}
.pic{position:absolute;width:11.51%;height:21.67%;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s;z-index:2}
.pic::before{content:"";position:absolute;inset:-1%;background:#ece2cc;filter:url(#roughSm)}
.pic::after{content:"";position:absolute;inset:0;background:url(img/grain.png);background-size:5cqw;mix-blend-mode:multiply;opacity:.16;pointer-events:none}
.pic img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;max-width:none}
.pic:hover,.pic:focus-visible{transform:translateY(-.3cqw);filter:drop-shadow(0 0 1.2cqw rgba(255,226,160,.45));outline:none}
.pic .plate{top:calc(100% + 1.1cqw);font-size:.8cqw}
.frame{position:relative;margin:0;aspect-ratio:1}
.turn{position:absolute;left:50%;bottom:4cqw;transform:translateX(-50%);width:4.2cqw;height:4.2cqw;border:0;padding:0;background:transparent;cursor:pointer;z-index:6;animation:bob 1.4s ease-in-out infinite}
.turn svg{width:45%;height:45%;opacity:.85}
.turn:focus-visible{outline:2px solid #fff;outline-offset:3px}
@keyframes bob{50%{transform:translate(-50%,.5cqw)}}
.zoom{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(3,2,2,.82);opacity:0;pointer-events:none;transition:opacity .45s;cursor:pointer}
.zoom.on{opacity:1;pointer-events:auto}
.frame.big{width:auto;height:62%;transform:scale(.6);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.zoom.on .frame.big{transform:none}
.frame.big .plate{font-size:1.5cqw;top:calc(100% + 2.6cqw)}
.wood{position:absolute;inset:-6%;z-index:-1;border-radius:2px;filter:url(#rough);
  background:url(img/grain.png),linear-gradient(135deg,#cbb48c,#a78e68 60%,#bca37b);background-size:9cqw,auto;background-blend-mode:soft-light,normal;
  box-shadow:0 0 4cqw 1cqw rgba(255,214,150,.18)}
.mat{position:absolute;inset:0;overflow:hidden;filter:url(#roughSm);background:#ece2cc}
.mat img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;max-width:none}
.mat::after{content:"";position:absolute;inset:0;background:url(img/grain.png);background-size:6cqw;mix-blend-mode:multiply;opacity:.12;pointer-events:none}
.aud2{top:0;height:100%;--b:.75}
.fzoom{position:absolute;inset:0;transform-origin:65% 26%;transition:transform 1.6s cubic-bezier(.5,0,.3,1),opacity .8s .9s}
.fzoom.in{transform:scale(3.4);opacity:0}
/* the eyes come only after the close-up, then all turn to look at you */
.aud2{opacity:0;transition:opacity 1.8s}
.aud2.on{opacity:1}
.aud2.stare{--b:1;--pupil:66%}
.aud2 .eye::after{left:calc(50% + var(--lx,0) * 26%);transition:width .7s cubic-bezier(.2,.8,.2,1),left .5s cubic-bezier(.5,0,.2,1)}
.aud2.stare .pair{--lx:0!important}
#fallen.whip .fzoom{transform:translateX(75%) scale(1.15);filter:blur(1.4cqw);opacity:0;transition:transform .55s cubic-bezier(.6,0,1,1),filter .55s,opacity .5s .1s}
.runbtn{position:absolute;left:50%;top:50%;z-index:8;transform:translate(-50%,-50%);border:0;padding:0 2cqw;background:none;cursor:pointer;font:inherit;font-weight:700;font-size:11cqw;letter-spacing:.08em;line-height:1;
  color:#f3ecdf;text-shadow:0 0 2.4cqw rgba(230,60,40,.55),0 .3cqw 1cqw #000;filter:url(#rough);opacity:0;transition:opacity .35s}
.runbtn.on{opacity:1;animation:runpulse .8s ease-in-out infinite}
.runbtn:focus-visible{outline:2px solid #fff;outline-offset:4px}
@keyframes runpulse{50%{transform:translate(-50%,-50%) scale(1.07)}}
/* running away */
#run{background:#000}
.runview{position:absolute;inset:-6%;background:#000}
.runview.going{animation:jog .28s ease-in-out infinite alternate}
.runview.stop,.runview.stop .wall3d{animation-play-state:paused}
@keyframes jog{from{transform:translate(-.6cqw,0) rotate(-.5deg)}to{transform:translate(.6cqw,1.5cqw) rotate(.5deg)}}
/* the corridor wall runs along your right, out to a vanishing point ahead */
.hall3d{position:absolute;inset:0;overflow:hidden;perspective:40cqw;perspective-origin:42% 48%}
.wall3d{position:absolute;top:0;height:100%;width:400cqw;left:calc(56% - 400cqw);transform-origin:100% 50%;transform:translateZ(34cqw) rotateY(-90deg);
  background-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.9) 55%,rgba(0,0,0,.45) 100%),url(img/corridor-bg.jpg);
  background-size:100% 100%,auto 100%;background-repeat:no-repeat,repeat-x;background-position:0 0,0 0}
.runview.going .wall3d{animation:wallrun .9s linear infinite}
@keyframes wallrun{to{background-position:0 0,112cqw 0}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 64% 60% at 45% 50%,transparent 30%,#000 100%)}
/* the box: in the middle of the corridor once you stop */
.cbox{position:absolute;left:44%;top:66%;width:17cqw;transform:translate(-50%,-50%);opacity:0;cursor:pointer;z-index:3;filter:brightness(.72);transition:opacity 1s,filter .3s}
.cbox img{display:block;width:100%;height:auto;position:relative}
.cbox::before{content:"";position:absolute;left:-12%;right:-12%;bottom:-9%;height:22%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.85),transparent)}
.cbox.near{opacity:1}
.cbox.near:hover,.cbox.near:focus-visible{filter:brightness(1);outline:none}
.cbox .hidetag{position:absolute;left:50%;bottom:calc(100% + 1.2cqw);transform:translateX(-50%);font-weight:600;font-size:1.6cqw;letter-spacing:.2em;color:#f3ecdf;
  text-shadow:0 .1cqw .8cqw #000;opacity:0;transition:opacity .25s;pointer-events:none}
.cbox.near:hover .hidetag,.cbox.near:focus-visible .hidetag{opacity:1}
.cbox.enter{transform:translate(-50%,-35%) scale(5);opacity:0;transition:transform .65s cubic-bezier(.5,0,.8,.4),opacity .6s}
/* inside the box */
#hide{background:#000;transition:background 5s}
#hide.open{background:#2a1b0a}
.lift{position:absolute;inset:0;transition:transform 3.6s cubic-bezier(.4,0,.3,1)}
#hide.up .lift{transform:translateY(55%)}
.boxgap{position:absolute;left:32%;right:32%;top:50%;height:.4%;transform:translateY(-50%);border-radius:.3cqw;
  background:linear-gradient(180deg,#f9d27a,#f2b01b 55%,#f1bd4d);box-shadow:0 0 1.5cqw .4cqw rgba(242,176,27,.6);filter:url(#roughSm);opacity:0;
  transition:opacity 1.4s,height 5s cubic-bezier(.4,0,.2,1),left 5s,right 5s,top 5s,box-shadow 5s}
.boxgap.on{opacity:1}
#hide.open .boxgap{height:68%;left:25%;right:25%;top:48%;box-shadow:0 0 9cqw 3cqw rgba(242,176,27,.55)}
.boxgap{overflow:hidden}
.rcat{position:absolute;left:-6%;top:-6%;width:112%;height:112%;max-width:none;object-fit:cover;object-position:50% 28%;opacity:0;filter:blur(1.3cqw);transition:opacity 2.6s}
.rcat.in{opacity:1}
.rglow{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fffdf6,#fff4dc 70%);opacity:0;transition:opacity 4s}
.rglow.on{opacity:.85}
.whiteout{position:absolute;inset:0;z-index:49;background:#fffaf0;opacity:0;pointer-events:none;transition:opacity 3s}
.whiteout.on{opacity:1}
/* the new home */
.tv{position:absolute;left:34.27%;top:15.73%;width:30.74%;height:29.44%;overflow:hidden;opacity:0;pointer-events:none;
  background:radial-gradient(circle at 50% 62%,#fff6d2 0,#f6d27a 38%,#d99644 75%,#a8662a 100%)}
.tv::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.06) 0 2px,transparent 2px 4px);pointer-events:none}
.tv img{position:absolute;left:50%;top:5%;height:90%;width:auto;max-width:none;transform:translateX(-50%)}
.tv.on{opacity:1;animation:tvon .5s ease-out}
@keyframes tvon{0%{transform:scaleY(.02);filter:brightness(4)}45%{transform:scaleY(.02);filter:brightness(4)}100%{transform:none;filter:none}}
.endpop{position:absolute;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none;background:rgba(20,14,6,0);transition:background .8s}
.endpop p{margin:0;font-weight:700;font-size:5cqw;color:#fff;letter-spacing:.01em;text-shadow:0 .2cqw 1.6cqw rgba(120,80,20,.55);opacity:0;transform:scale(.6)}
.again2{pointer-events:auto;font:inherit;font-weight:600;font-size:1.1cqw;padding:.7cqw 1.6cqw;border-radius:2cqw;border:0;background:rgba(255,255,255,.85);color:#111;cursor:pointer}
.endpop.on{background:rgba(20,14,6,.28)}
.endpop.on p{animation:endpop .55s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes endpop{to{opacity:1;transform:none}}
.fade p.thanks{text-transform:none;letter-spacing:.02em;font-size:2.6cqw;font-weight:600}
.plate{position:absolute;left:50%;top:calc(100% + 1.7cqw);transform:translateX(-50%);padding:.25cqw .9cqw;font-weight:600;font-size:.95cqw;letter-spacing:.12em;
  color:#2a1d10;background:url(img/grain.png),#b89a62;background-size:5cqw,auto;background-blend-mode:soft-light,normal;border-radius:2px;filter:url(#roughSm);font-variant-numeric:tabular-nums;white-space:nowrap}
.sunny{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .8s;z-index:20;cursor:pointer;background:#cfe6ef}
.sunny.on{opacity:1;pointer-events:auto}
.glow{position:absolute;inset:-25%;filter:blur(6cqw);animation:breathe 14s ease-in-out infinite alternate;
  background:
    radial-gradient(circle at 74% 26%,#ffe7a8 0 14%,transparent 34%),
    radial-gradient(circle at 30% 30%,#9fd2f2 0 18%,transparent 40%),
    radial-gradient(ellipse 22% 12% at 46% 16%,#ffffff 0 45%,transparent 100%),
    radial-gradient(ellipse 16% 9% at 16% 24%,#ffffff 0 45%,transparent 100%),
    radial-gradient(ellipse 18% 10% at 66% 44%,rgba(255,255,255,.85) 0 40%,transparent 100%),
    radial-gradient(circle at 26% 78%,#b9dca0 0 16%,transparent 36%),
    radial-gradient(circle at 78% 82%,#cfe5a8 0 14%,transparent 34%),
    radial-gradient(circle at 55% 60%,#fff1cc 0 16%,transparent 40%),

<script>
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const CAST = {
  meow: {name:'Meow', color:'var(--meow)', img:'img/meow.png'},
  mmm:  {name:'Meow-meow-meow', color:'var(--mmm)', img:'img/meowmeowmeow.png'},
  mdm:  {name:'Meow~meow', color:'var(--mdm)', img:'img/meow-dash-meow.png'},
  me:   {name:'Meow-meow (you)', color:'var(--mm)', img:'img/meowmeow.png'},
  tv:   {name:'Human Show News', color:'#d9822c', img:'img/meowmeowmeow.png'}
};
['img/home.jpg','img/corridor-bg.jpg','img/fallen-wide.jpg','img/fallen-close.jpg','img/wall-1871.png','img/wall-1889.png','img/wall-1906.png','img/wall-1961.png','img/wall-2026.png','img/grain.png','img/hall-door.jpg','img/hall-cat.jpg','img/sil-flat.png','img/sil-short.png','img/sil-fold.png','img/sil-bald.png','img/leave.jpg','img/street.jpg','img/date-29.png','img/room-a.jpg','img/room-a2.jpg','img/room-b-bags.jpg','img/date-27.png','img/date-28.png','img/room-b-boxes.jpg','img/door-closed.jpg','img/door-open.jpg','img/door-paw.jpg',
 ...Object.values(CAST).map(c=>c.img),'img/rice.png','img/apple.png','img/milk.png'].forEach(s=>{const i=new Image();i.src=s;});

let day = 1, busy = false, windowSeen = false, talkedSibs = false;
const LAST_DAY = 4;
function refresh(){
  $('roomAbg').src = day >= 3 ? 'img/room-a2.jpg' : 'img/room-a.jpg';
  $('roomBbg').src = day >= 3 ? 'img/room-b-bags.jpg' : 'img/room-b-boxes.jpg';
  const sibsOn = day === 1 ? windowSeen : true;
  document.querySelectorAll('.sib').forEach(h => h.hidden = !sibsOn);
  if (day >= 3) $('hSibO').hidden = true;
  $('toRight').hidden = day === 1 ? !talkedSibs : false;
  $('toDoor').hidden = day < 2;
  $('doorBack').hidden = day < 2;
  $('hBoxes').hidden = day !== 2;
  $('hBags').hidden = day !== 3;
  const d = DATES[day];
  $('cal').hidden = $('calImg').hidden = !d;
  if (d){ const c = $('calImg'); c.src = d.src; c.style.left = d.x+'%'; c.style.top = d.y+'%'; c.style.width = d.w+'%'; }
}
const DATES = {
  2:{src:'img/date-27.png', x:82.812, y:14.259, w:4.062},
  3:{src:'img/date-28.png', x:82.865, y:14.259, w:3.646},
  4:{src:'img/date-29.png', x:82.812, y:14.074, w:3.958}
};
function show(id){ ['roomA','roomB','door','leave','street','hall','doorlight','judge','jcage','corridor','fallen','run','hide','home'].forEach(s => $(s).classList.toggle('on', s===id)); }
function onTap(el, fn){
  el.addEventListener('click', e => { e.stopPropagation(); if(!busy) fn(); });
  el.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && !busy){ e.preventDefault(); fn(); } });
}

/* ---- dialogue ---- */
function talk(lines, choice){
  return new Promise(done => {
    busy = true;
    const t = $('talk'), L = $('whoL'), R = $('whoR');
    let i = 0;
    L.className='who l'; R.className='who r';
    t.classList.add('on'); $('stage').classList.add('talking');
    const step = () => {
      if (i >= lines.length && choice && !$('choice').dataset.shown){
        const c = $('choice'); c.textContent = choice; c.hidden = false; c.dataset.shown = '1'; t.classList.add('choosing');
        t.removeEventListener('click', step); document.removeEventListener('keydown', key);
        const pick = e => { e.stopPropagation(); c.removeEventListener('click', pick); c.hidden = true; delete c.dataset.shown; t.classList.remove('choosing'); i = lines.length; finish(); };
        c.addEventListener('click', pick); c.focus();
        return;
      }
      if (i >= lines.length){ finish(); return; }
      function finish(){
        t.classList.remove('on'); $('stage').classList.remove('talking'); L.className='who l'; R.className='who r';
        t.removeEventListener('click', step); document.removeEventListener('keydown', key);
        setTimeout(()=>{ busy=false; done(); }, 350);
      }
      const [who, text] = lines[i], c = CAST[who];

function setCam(n){

    const out = ctx.createGain(); out.gain.value = .05;
    if (p){ p.pan.value = pan; out.connect(p); p.connect(sfxBus); } else out.connect(sfxBus);
    const notes = 2 + Math.floor(Math.random()*4);
    for (let i = 0; i < notes; i++){
      const st = t + i * (.07 + Math.random()*.05), o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(base * (1 + Math.random()*.15), st);
      o.frequency.exponentialRampToValueAtTime(base * (1.35 + Math.random()*.3), st + .05);
      o.frequency.exponentialRampToValueAtTime(base * .9, st + .09);
      g.gain.setValueAtTime(.0001, st); g.gain.linearRampToValueAtTime(1, st + .01); g.gain.exponentialRampToValueAtTime(.0001, st + .1);
      o.connect(g); g.connect(out); o.start(st); o.stop(st + .12);
    }
  }
  function birds(on){
    if (!ctx) return;
    clearTimeout(birdTimer);
    if (!on){ duck(1); return; }
    duck(.55);
    const loop = () => {
      const voices = [[2600, -.6], [3300, .5], [2100, .1]];
      const [b, pan] = voices[Math.floor(Math.random()*voices.length)];
      chirp(ctx.currentTime + .05, b, pan + (Math.random()-.5)*.3);
      if (Math.random() < .35) chirp(ctx.currentTime + .45, b * 1.05, pan);
      birdTimer = setTimeout(loop, 500 + Math.random()*1300);
    };
    loop();
  }

  function unlock(){
    init();
    if (ctx.state === 'suspended') ctx.resume();
    if (!started){ started = true; startMusic(); }
  }
  function setMuted(m){
    muted = m;
    try { localStorage.setItem('hs-muted', m ? '1' : '0'); } catch(_){}
    if (ctx) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, .1);
    $('sndWaves').style.display = m ? 'none' : ''; $('sndOff').style.display = m ? '' : 'none';
    $('snd').setAttribute('aria-label', m ? 'Turn sound on' : 'Mute sound');
  }
  return { unlock, knock, door, meow, scream, fall, eerie, hiss, heart, whoosh, chew, chase, steps, pant, boxIn, chaos, flap, tvOn, tv, footstep, slam, lock: latch, hall, breath, gasp, breathLevel, purr, birds, duck, setMuted, get muted(){ return muted; } };
})();
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, () => Sound.unlock(), {capture:true}));
$('snd').addEventListener('click', e => { e.stopPropagation(); Sound.unlock(); Sound.setMuted(!Sound.muted); });
Sound.setMuted(Sound.muted);

/* ---- full screen ---- */
$('fs').addEventListener('click', e => {
  e.stopPropagation();
  try { document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen().catch(()=>{}); } catch(_){}
});

start();
</script>
